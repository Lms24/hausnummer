<!doctype html>
<html lang="de-AT">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Seite nicht gefunden – Hausnummer</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f4f3ef;
				--text: #0b0b0b;
				--muted: #52514e;
				--accent: #22594b;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #121211;
					--text: #f0efec;
					--muted: #c3c2b7;
					--accent: #7cc7b0;
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--bg);
				color: var(--text);
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				padding: 16px;
				text-align: center;
			}
			h1 {
				font-size: 28px;
				margin: 0 0 8px;
			}
			p {
				color: var(--muted);
				margin: 0 0 20px;
			}
			a {
				color: var(--accent);
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Falsche Hausnummer</h1>
			<p>Diese Seite gibt es nicht.</p>
			<a href="/">Zum Wohnkreditrechner →</a>
		</main>
	</body>
</html>
